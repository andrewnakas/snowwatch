name: Calibrate SNOW-17 parameters

# Per-station SNOW-17 calibration is expensive to run from cold (each station
# needs ~2 seasons of SNOTEL + Open-Meteo history to fit MFMAX/MFMIN/UADJ/
# PXTEMP) but the resulting JSON files are tiny and change slowly. Run it
# weekly and commit the deltas back to main; the Pages build picks them up at
# next checkout via app.snow17_calibrate.apply_cached().

on:
  schedule:
    - cron: "0 7 * * 1"   # every Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit number of stations (0 = all)"
        type: string
        required: false
        default: "0"
      force:
        description: "Re-fit even fresh cache entries"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore long-lived data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sw-calibrate-cache-${{ github.run_id }}
          restore-keys: |
            sw-calibrate-cache-

      - name: Refresh SNOTEL station list
        run: python scripts/fetch_stations.py

      - name: Run calibration
        run: |
          python scripts/calibrate_snow17.py \
            --limit ${{ github.event.inputs.limit || '0' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit updated calibration cache
        run: |
          git config user.name "snowwatch-bot"
          git config user.email "noreply@anthropic.com"
          git add data/snow17_params/*.json || true
          if git diff --cached --quiet; then
            echo "no calibration changes"
            exit 0
          fi
          git commit -m "calibrate: refresh SNOW-17 params $(date -u +%Y-%m-%d)"
          git push
