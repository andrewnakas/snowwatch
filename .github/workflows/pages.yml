name: Build & deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"  # rebuild every 6 hours
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bootstrap: drop SW_NO_FETCH so cold caches fill (expensive, run once)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # merge job appends the forecast archive to monthly Release assets
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TOTAL_SHARDS: 4

jobs:
  build:
    runs-on: ubuntu-latest
    # 4 fat shards, not 8 thin ones: on the free-tier runner budget a build
    # only completes when ALL its shards get runners at once. 8 parallel jobs
    # rarely schedule together, so builds sat queued for hours and overlapped
    # the next 6h run (2026-06-15). 4 shards schedule reliably; each does ~2x
    # the stations (~230) at ~75-120 min, well under the timeout.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch wheel)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-chronos-bolt-small-v1

      - name: Restore per-shard incremental data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sw-cache-v1-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            sw-cache-v1-shard-${{ matrix.shard }}-
            sw-cache-v1-shard-

      - name: Refresh SNOTEL station list
        # Every shard fetches its own copy of data/stations.json — the catalogue
        # is small and the in-module disk cache makes the second-through-Nth
        # call free. Doing this here avoids cross-shard race conditions where
        # shards 1..N start before shard 0 has finished writing the file.
        # AWDB is flaky from runner IPs; fetch_stations refuses to overwrite
        # the committed catalogue with a bad pull, so fall back to it.
        run: python scripts/fetch_stations.py || echo "AWDB unreachable; using committed station catalogue"

      - name: Decide ensemble fetch window
        # Member-level ensemble pulls are the heaviest Open-Meteo calls; do
        # them on the 00Z and 12Z builds only. Other builds reuse the <=11h
        # cache (see app/met.py).
        id: ens
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 6 ] || { [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 18 ]; }; then
            echo "ensemble=1" >> "$GITHUB_OUTPUT"
          else
            echo "ensemble=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}
        env:
          PYTHONUNBUFFERED: "1"
          SW_NO_FETCH: ${{ github.event.inputs.bootstrap == 'true' && '0' || '0' }}
          SW_ENABLE_CHRONOS: "1"
          SW_ENSEMBLE_BUILD: ${{ steps.ens.outputs.ensemble }}
        run: |
          python scripts/build_static_site.py \
            --shard-id ${{ matrix.shard }} \
            --total-shards ${{ env.TOTAL_SHARDS }} \
            --horizon 7

      - name: Archive shard forecasts
        run: python scripts/archive_forecasts.py --shard-id ${{ matrix.shard }}

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-shard-${{ matrix.shard }}
          path: dist
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    # Deploy whatever shards delivered. A single evicted runner (it happens —
    # shards 5/6 got shutdown signals on 2026-06-12) concludes "cancelled",
    # which fails `needs.build.result != 'cancelled'`; use the `cancelled()`
    # status function instead, which is true ONLY when the whole workflow was
    # cancelled by a human, not when GitHub evicts one matrix runner.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: shard_dists
          pattern: dist-shard-*

      - name: Merge shards
        # --min-shards guards against deploying a mostly-empty site when many
        # shards die at once (a real outage, not a stray eviction). With
        # TOTAL_SHARDS=4, require 3 (one stray eviction tolerated).
        run: python scripts/merge_shards.py --input-root shard_dists --min-shards 3

      - name: Build verification scorecard page
        # Static assembly from committed benchmarks/*.json — no NWP calls.
        # Failures must not block the site deploy.
        run: python scripts/build_scorecard.py || echo "scorecard skipped"

      - name: Append forecast archive to monthly Release asset
        # Headerless gzip CSV streams are byte-appendable; the monthly asset
        # grows by simple concat. The release is created on first use.
        if: hashFiles('forecast_archive_build.csv.gz') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="forecast-archive"
          MONTH=$(date -u +%Y-%m)
          ASSET="archive-${MONTH}.csv.gz"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Forecast archive" \
              --notes "Rolling long-format forecast archive (headerless gzip CSV, schema in app/archive.py)"
          if gh release download "$TAG" --pattern "$ASSET" --output existing.csv.gz 2>/dev/null; then
            cat existing.csv.gz forecast_archive_build.csv.gz > "$ASSET"
          else
            cp forecast_archive_build.csv.gz "$ASSET"
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "uploaded $ASSET ($(du -k "$ASSET" | cut -f1) KB)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: merge
    # merge runs under !cancelled(); deploy must use the same gate or it is
    # skipped whenever an evicted runner made `merge`'s upstream "cancelled".
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
